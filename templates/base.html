<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}modelab{% endblock title %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Forum&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" crossorigin="anonymous">
</head>
<body class="font-sans antialiased" style="background-color:#f6f8f5; color:#536942;">

  <!-- NAV -->
  <header class="sticky top-0 z-50 px-8 py-4 flex items-center justify-between bg-white border-b border-gray-100">
    <a href="/">
      <img src="/images/logo.png" alt="modelab" class="h-7">
    </a>
    <nav class="hidden md:flex gap-8 text-sm font-light" style="color:#536942;">
      <a href="/" class="hover:opacity-60 transition">Home</a>
      <a href="/about" class="hover:opacity-60 transition">About</a>
      <a href="/services" class="hover:opacity-60 transition">Services</a>
      <a href="/contact" class="hover:opacity-60 transition">Contact</a>
    </nav>
    <button class="md:hidden" style="color:#536942;" onclick="document.getElementById('mobile-menu').classList.toggle('hidden')">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </button>
  </header>

  <!-- Mobile menu -->
  <div id="mobile-menu" class="hidden fixed inset-0 z-40 bg-white flex flex-col items-center justify-center gap-8">
    <button class="absolute top-6 right-8 text-gray-400 text-2xl" onclick="document.getElementById('mobile-menu').classList.add('hidden')">✕</button>
    <a href="/" class="text-2xl font-light" style="color:#536942;" onclick="document.getElementById('mobile-menu').classList.add('hidden')">Home</a>
    <a href="/about" class="text-2xl font-light" style="color:#536942;" onclick="document.getElementById('mobile-menu').classList.add('hidden')">About</a>
    <a href="/services" class="text-2xl font-light" style="color:#536942;" onclick="document.getElementById('mobile-menu').classList.add('hidden')">Services</a>
    <a href="/contact" class="text-2xl font-light" style="color:#536942;" onclick="document.getElementById('mobile-menu').classList.add('hidden')">Contact</a>
  </div>

  <main>
    {% block content %}{% endblock content %}
  </main>

  <!-- FOOTER -->
  <footer class="py-8 px-8 flex flex-col md:flex-row items-center justify-between gap-4 bg-white border-t border-gray-100">
    <nav class="flex gap-6 text-sm" style="color:#536942;">
      <a href="/" class="hover:opacity-60 transition">Home</a>
      <a href="/about" class="hover:opacity-60 transition">About</a>
      <a href="/services" class="hover:opacity-60 transition">Services</a>
      <a href="/contact" class="hover:opacity-60 transition">Contact</a>
    </nav>
    <p class="text-sm" style="color:#536942;">© modelab 2023</p>
  </footer>

</body>
</html>
