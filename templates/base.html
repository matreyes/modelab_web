<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}modelab{% endblock title %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Forum&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" crossorigin="anonymous">
  <!-- Motion One - Animation Library -->
  <script src="https://cdn.jsdelivr.net/npm/motion@latest/dist/motion.min.js"></script>
  <style>
    /* NAV */
    .site-header {
      position: sticky; top: 0; left: 0; right: 0; z-index: 50;
      padding: 0 2rem; height: 80px;
      display: flex; align-items: center; justify-content: space-between;
      background: #ffffff; border-bottom: 1px solid #e5e7eb;
    }
    .site-header > a { display: flex; align-items: center; }
    .nav-links { display: flex; gap: 2rem; }
    .nav-links a {
      color: #536942; font-size: 0.875rem; font-weight: 300;
      transition: opacity 0.2s;
    }
    .nav-links a:hover { opacity: 0.6; }
    .hamburger-btn {
      display: none;
      background: #ffd936; border: none; border-radius: 4px;
      padding: 8px 10px; cursor: pointer; line-height: 0;
    }

    /* MOBILE MENU */
    #mobile-menu {
      display: none; position: fixed; inset: 0; z-index: 100;
      background: #ffffff; flex-direction: column;
      align-items: center; justify-content: center; gap: 2.5rem;
    }
    #mobile-menu.open { display: flex; }
    #mobile-menu a { color: #536942; font-size: 1.5rem; font-weight: 300; }
    #mobile-menu .close-btn {
      position: absolute; top: 1.5rem; right: 2rem;
      background: none; border: none; font-size: 1.5rem; color: #536942; cursor: pointer;
    }

    /* RESPONSIVE */
    @media (max-width: 640px) {
      .nav-links { display: none; }
      .hamburger-btn { display: block; }
    }
    @media (min-width: 641px) and (max-width: 1023px) {
      .nav-links { display: none; }
      .hamburger-btn { display: block; }
    }
    @media (min-width: 1024px) {
      .hamburger-btn { display: none; }
      .nav-links { display: flex; }
    }
  </style>
</head>
<body class="font-sans antialiased" style="background-color:#f6f8f5; color:#536942;">

  <!-- NAV -->
  <header class="site-header">
    <a href="/">
      <img src="/images/logo.png" alt="modelab" style="height:80px; display:block;">
    </a>
    <nav class="nav-links">
      <a href="/" class="hover:opacity-60 transition">Home</a>
      <a href="/about" class="hover:opacity-60 transition">About</a>
      <a href="/services" class="hover:opacity-60 transition">Services</a>
      <a href="/contact" class="hover:opacity-60 transition">Contact</a>
    </nav>
    <button class="hamburger-btn" onclick="document.getElementById('mobile-menu').classList.add('open')" aria-label="Menu">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round">
        <path d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </button>
  </header>

  <!-- Mobile menu -->
  <div id="mobile-menu">
    <button class="close-btn" onclick="document.getElementById('mobile-menu').classList.remove('open')">✕</button>
    <a href="/" onclick="document.getElementById('mobile-menu').classList.remove('open')">Home</a>
    <a href="/about" onclick="document.getElementById('mobile-menu').classList.remove('open')">About</a>
    <a href="/services" onclick="document.getElementById('mobile-menu').classList.remove('open')">Services</a>
    <a href="/contact" onclick="document.getElementById('mobile-menu').classList.remove('open')">Contact</a>
  </div>

  <main>
    {% block content %}{% endblock content %}
  </main>

  <!-- FOOTER -->
  <footer class="py-8 px-8 flex flex-col md:flex-row items-center justify-between gap-4 bg-white border-t border-gray-100">
    <nav class="flex gap-6 text-sm" style="color:#536942;">
      <a href="/" class="hover:opacity-60 transition">Home</a>
      <a href="/about" class="hover:opacity-60 transition">About</a>
      <a href="/services" class="hover:opacity-60 transition">Services</a>
      <a href="/contact" class="hover:opacity-60 transition">Contact</a>
    </nav>
    <p class="text-sm" style="color:#536942;">© modelab 2023</p>
  </footer>

</body>
</html>
