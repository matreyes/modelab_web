{% extends "base.html" %}
{% block title %}Contact — modelab{% endblock title %}

{% block content %}

<!-- HERO -->
<section class="relative flex items-center justify-center text-center overflow-hidden"
  style="min-height:300px; background-image:url('/images/hero-contact.png'); background-size:cover; background-position:center;">
  <div class="absolute inset-0" style="background:rgba(0,0,0,0.3);"></div>
  <div class="relative z-10">
    <h1 style="font-family:'Forum',serif; font-size:clamp(42px,6vw,64px); color:#ffffff; font-weight:400; letter-spacing:-1px; margin:0;">
      contact us
    </h1>
  </div>
</section>

<!-- CONTENT -->
<section class="max-w-3xl mx-auto px-6 py-24" style="background:#ffffff;">

  <p class="font-light mb-12" style="font-size:1.1rem; color:rgba(82,104,64,0.75);">
    You can find us at
  </p>

  <div class="grid md:grid-cols-2 gap-12 mb-16">

    <div>
      <p class="text-xs font-medium tracking-widest uppercase mb-3" style="color:rgba(82,104,64,0.5);">Email</p>
      <a href="mailto:contact@modelab.cl"
         class="text-lg font-light hover:opacity-70 transition"
         style="color:#536942;">
        contact@modelab.cl
      </a>
    </div>

    <div>
      <p class="text-xs font-medium tracking-widest uppercase mb-3" style="color:rgba(82,104,64,0.5);">Location</p>
      <p class="text-lg font-light leading-relaxed" style="color:#536942;">
        Jorge Matte, Providencia<br>
        Santiago, Chile
      </p>
    </div>

  </div>

  <!-- Social -->
  <div class="flex gap-6">
    <a href="https://www.twitter.com" target="_blank" rel="noopener"
       class="inline-flex items-center gap-2 text-sm font-light hover:opacity-70 transition"
       style="color:#536942;">
      <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
        <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.747l7.73-8.835L1.254 2.25H8.08l4.259 5.629 5.905-5.629zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
      </svg>
      Twitter
    </a>
    <a href="https://www.linkedin.com/company/2585486" target="_blank" rel="noopener"
       class="inline-flex items-center gap-2 text-sm font-light hover:opacity-70 transition"
       style="color:#536942;">
      <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
        <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
      </svg>
      LinkedIn
    </a>
  </div>

</section>
{% endblock content %}
